version: "1.0.0"
title: "1С: проверка в браузере"
description: "Этап 4 из 4. Проверить доработку в веб-клиенте 1С навыком web-test и описать найденные ошибки."
parameters:
  - key: scenario
    input_type: string
    requirement: required
    description: "Что проверить (например «создать задачу, выполнить её и проверить, что все шаги видны в истории»)"
  - key: database
    input_type: string
    requirement: optional
    default: "по умолчанию"
    description: "База из .v8-project.json (id или имя)"
instructions: |
  Ты проверяешь доработку в веб-клиенте 1С навыком web-test. Это этап ПРОВЕРКИ.

  1. Загрузи навык web-test. Адрес базы возьми из .v8-project.json (webUrl); если база не опубликована —
     предложи навык web-publish. Если зависимости web-test не установлены — установи их по инструкции навыка.
  2. Составь короткий сценарий шагов и выполни его в автономном режиме (run). Для отладки сценария
     используй интерактивный режим (start в фоне, exec, stop), не перезапуская вход в базу каждый раз.
  3. Код на этом этапе не меняй. Если нашлась ошибка — опиши: шаг, ожидаемый и фактический результат,
     снимок экрана; предложи вернуться к рецепту «1С: доработка по плану» с этим описанием.
  4. В конце обязательно закрой браузер (stop), если запускал интерактивную сессию.
prompt: |
  Проверь в браузере (база «{{ database }}»): {{ scenario }}
activities:
  - "message: **Этап 4 — проверка в браузере.** goose выполнит сценарий в веб-клиенте 1С и опишет результат."
