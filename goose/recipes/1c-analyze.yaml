version: "1.0.0"
title: "1С: анализ и план доработки"
description: "Этап 1 из 4. Изучить задачу и объекты 1С в выгрузке и составить план изменений. Ничего не меняет."
parameters:
  - key: task
    input_type: string
    requirement: required
    description: "Что нужно сделать (постановка задачи своими словами)"
  - key: scope
    input_type: string
    requirement: optional
    default: "не указаны"
    description: "Объекты 1С, если известны (например «Документ.Задача, РегистрСведений.ИсторияЗадач»)"
instructions: |
  Ты работаешь с XML-выгрузкой конфигурации 1С в текущей папке проекта. Это этап АНАЛИЗА И ПЛАНА:
  ничего не изменяй — не правь файлы, не загружай в базу, не запускай навыки *-edit/*-compile/db-*.

  1. Если в задаче не хватает данных, которые меняют результат, — задай вопросы инструментом ask_user
     (все сразу, с вариантами ответа) и дождись ответов.
  2. Найди нужные объекты и код инструментами сервера search: find_object (объект по смыслу),
     module_methods, find_method (метод сразу с кодом), find_usages (кто вызывает). Структуру объектов
     и форм смотри навыками meta-info, form-info, cf-info. Не используй grep/sed/cat по XML.
  3. Реши, где делать доработку: объекты типовой конфигурации на поддержке — только в расширении
     (cfe-init, cfe-borrow, cfe-patch-method). Определи, что заимствовать, какие методы перехватить,
     какие реквизиты, формы, команды, макеты добавить.
  4. Итог — план в виде списка: объект → что изменить → каким навыком. Отдельно: риски и как проверить
     результат. Не пиши код целиком — только ключевые места.
  5. Последней строкой предложи пользователю открыть в новом чате рецепт «1С: доработка по плану»
     и вставить в него этот план.
prompt: |
  Задача: {{ task }}
  Объекты (если известны): {{ scope }}
activities:
  - "message: **Этап 1 — анализ и план.** goose изучит выгрузку и составит план, ничего не меняя. Дальше: «доработка по плану» → «загрузка в базу» → «проверка в браузере»."
