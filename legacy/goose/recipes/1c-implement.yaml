version: "1.0.0"
title: "1С: доработка по плану"
description: "Этап 2 из 4. Внести изменения в выгрузку по готовому плану и проверить их. В базу не загружает."
parameters:
  - key: plan
    input_type: string
    requirement: required
    description: "План из этапа «анализ и план» (вставьте целиком)"
  - key: extension
    input_type: string
    requirement: optional
    default: "по плану"
    description: "Имя расширения, если доработка в расширении"
instructions: |
  Ты работаешь с XML-выгрузкой конфигурации 1С в текущей папке проекта. Это этап РЕАЛИЗАЦИИ.

  1. Выполни план по шагам. Для каждого изменения загружай профильный навык (load_skill) и следуй ему:
     cfe-init, cfe-borrow, cfe-patch-method — расширения; meta-edit/meta-compile — объекты; form-edit/
     form-compile — формы; skd-edit — СКД; role-edit — роли. XML вручную не правь.
  2. Если по ходу появляются неясности — спроси инструментом ask_user, не додумывай.
  3. После изменений проверь результат: *-validate по изменённым объектам (cfe-validate, meta-validate,
     form-validate…) и навык bsl-check по каталогу расширения или изменённых объектов. Исправь все ошибки.
  4. В базу НЕ загружай — это следующий этап.
  5. Итог: список изменённых объектов и файлов, результаты проверок. Последней строкой предложи открыть
     в новом чате рецепт «1С: загрузка в базу».
prompt: |
  Выполни план. Расширение: {{ extension }}

  {{ plan }}
activities:
  - "message: **Этап 2 — доработка.** goose внесёт изменения навыками и проверит их (validate, bsl-check). В базу не загружает."
