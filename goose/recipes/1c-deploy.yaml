version: "1.0.0"
title: "1С: загрузка в базу"
description: "Этап 3 из 4. Проверить код, загрузить изменения в информационную базу, обновить её и при необходимости снять безопасный режим расширения."
parameters:
  - key: database
    input_type: string
    requirement: optional
    default: "по умолчанию"
    description: "База из .v8-project.json (id или имя); по умолчанию — по ветке Git или основная"
  - key: extension
    input_type: string
    requirement: optional
    default: "нет"
    description: "Имя расширения, если загружается расширение"
instructions: |
  Ты загружаешь изменения из XML-выгрузки в информационную базу 1С. Это этап ЗАГРУЗКИ.

  1. Проверь код навыком bsl-check по каталогу расширения или изменённых объектов. Если есть ошибки
     уровня «ошибка» — остановись и покажи их; не загружай.
  2. Покажи пользователю, что и в какую базу будет загружено, и получи подтверждение инструментом
     ask_user (база, расширение, полная или частичная загрузка).
  3. Загрузи навыком db-load-xml (для расширения — с -Extension; из Git — db-load-git), затем обнови
     базу навыком db-update.
  4. Для расширения: навыком db-cfe-admin посмотри свойства (list). Расширение после первой загрузки
     работает в безопасном режиме — перехватчики в нём не срабатывают. Если доработке нужны перехватчики
     или внешние ресурсы — сними: db-cfe-admin set-properties -SafeMode off. Если ibcmd нет или база
     серверная — попроси пользователя снять флажок вручную («Все функции → Стандартные → Управление
     расширениями конфигурации»).
  5. Итог: что загружено, результат обновления, состояние расширения. Последней строкой предложи открыть
     в новом чате рецепт «1С: проверка в браузере».
prompt: |
  Загрузи изменения в базу «{{ database }}». Расширение: {{ extension }}.
activities:
  - "message: **Этап 3 — загрузка в базу.** Сначала проверка кода (bsl-check), затем подтверждение, загрузка, обновление базы и безопасный режим расширения."
